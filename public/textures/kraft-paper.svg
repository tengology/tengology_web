<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.48 0.12" numOctaves="3" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.24 0 0 0 0 0.15 0 0 0 0 0.07 0 0 0 0.4 0"/>
  </filter>
  <filter id="pulp" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.23 0 0 0 0 0.10 0 0 0 0.16 0"/>
  </filter>
  <rect width="420" height="420" filter="url(#pulp)"/>
  <rect width="420" height="420" filter="url(#fibres)"/>
</svg>
